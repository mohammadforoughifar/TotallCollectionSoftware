<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>تأیید هویت — ماکاپ پنل پشتیبانی</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--muted:#6b7280;--line:#e5e7eb;--brand:#1f6feb;--ok:#0f7b3f;--warn:#a15c00;--err:#a3182a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;direction:rtl;line-height:1.9}
header{background:#111827;color:#fff;padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header b{font-size:1rem}
nav a{color:#d1d5db;text-decoration:none;margin-inline-end:.9rem;font-size:.85rem}
nav a:hover{color:#fff}
main{max-width:1080px;margin:0 auto;padding:1.2rem}
h1{font-size:1.15rem;margin:.2rem 0 .3rem}
.lead{color:var(--muted);font-size:.85rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-block-end:1rem;overflow:hidden}
.card-head{padding:.55rem .9rem;border-block-end:1px solid var(--line);font-weight:700;font-size:.9rem;background:#fafbfd}
.card-body{padding:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-block-end:.25rem}
input,select,textarea{width:100%;padding:.45rem .6rem;border:1px solid #cfd4dc;border-radius:7px;font:inherit;font-size:.85rem;background:#fff}
textarea{min-height:90px}
button{padding:.45rem .9rem;border-radius:7px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;font-size:.85rem;cursor:pointer}
button.ghost{background:#fff;color:var(--brand)}
button.danger{background:#a3182a;border-color:#a3182a}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{padding:.45rem .6rem;border-block-end:1px solid var(--line);text-align:right}
th{background:#fafbfd;color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.72rem;border:1px solid var(--line);background:#f3f4f6}
.badge.ok{background:#e7f6ec;border-color:#bfe3cb;color:var(--ok)}
.badge.warn{background:#fdf3e2;border-color:#f0d9b0;color:var(--warn)}
.badge.err{background:#fdeaea;border-color:#f3c2c2;color:var(--err)}
.alert{padding:.55rem .8rem;border-radius:8px;font-size:.82rem;margin-block-end:.8rem;border:1px solid var(--line);background:#fff}
.alert.ok{background:#e7f6ec;border-color:#bfe3cb}
.alert.warn{background:#fdf3e2;border-color:#f0d9b0}
.alert.err{background:#fdeaea;border-color:#f3c2c2}
.kv{display:grid;grid-template-columns:150px 1fr;gap:.25rem .8rem;font-size:.82rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.mono{font-family:"Courier New",monospace;direction:ltr;unicode-bidi:embed}
pre{background:#0f172a;color:#e2e8f0;padding:.7rem;border-radius:8px;font-size:.75rem;overflow:auto;direction:ltr;text-align:left}
.hint{color:var(--muted);font-size:.75rem}
.note{background:#eef4ff;border:1px solid #c9dcff;border-radius:8px;padding:.5rem .8rem;font-size:.78rem;color:#1e3a8a;margin-block-end:1rem}
footer{color:var(--muted);font-size:.72rem;text-align:center;padding:1.2rem}
</style>
</head>
<body>
<header>
  <b>پنل پشتیبانی لایسنس</b>
  <nav>
    <a href="index.html">فهرست</a>
    <a href="01-requests-list.html">درخواست‌ها</a>
    <a href="08-customers-list.html">مشتریان</a>
    <a href="10-licenses-list.html">لایسنس‌ها</a>
    <a href="12-renewals.html">تمدیدها</a>
    <a href="13-settings-smtp.html">تنظیمات</a>
  </nav>
  <span style="margin-inline-start:auto;font-size:.8rem;color:#9ca3af">مدیر سامانه (مدیر)</span>
</header>
<main>
<div class="note">ماکاپ ایستای RTL — فقط برای بازبینی چیدمان و متن‌ها؛ هیچ منطق یا اتصالی ندارد.</div>
<h1>تأیید هویت</h1>
<p class="lead">چه کسی، با چه روشی، چه زمانی — پیش‌شرط تأیید درخواست</p>

<div class="card"><div class="card-body">
  <form>
    <div class="grid">
      <div class="field"><label>روش</label><select><option>تلفن</option><option>ایمیل</option><option>قرارداد</option><option>حضوری</option></select></div>
      <div class="field"><label>تأیید با</label><input value="کاربر آزمون" /></div>
      <div class="field"><label>تاریخ (شمسی)</label><input class="mono" value="1405/08/23" /></div>
    </div>
    <div class="field"><label>یادداشت</label><textarea placeholder="مثلاً: تماس با شمارهٔ ثبت‌شده و تطبیق نام تأییدکننده"></textarea></div>
    <p><button type="button">ثبت تأیید هویت</button></p>
  </form>
</div></div>
</main>
<footer>پنل پشتیبانی — فارسی، تاریخ شمسی، ساعت تهران · فقط localhost</footer>
</body>
</html>
