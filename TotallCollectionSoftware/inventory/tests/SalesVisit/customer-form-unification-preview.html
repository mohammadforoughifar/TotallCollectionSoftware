<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرم مشترک تعریف مشتری</title>
<style>
  :root { --primary:#4f46e5; --line:#e2e8f0; --muted:#64748b; --ink:#0f172a; --bg:#f8fafc; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 32px; font-family:Tahoma,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  .entry { max-width:720px; margin:0 auto 16px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .entry button { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px;
                  padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; }
  .entry button.active { border-color:var(--primary); color:var(--primary); background:#eef2ff; font-weight:700; }
  .backdrop { position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:center;
              justify-content:center; padding:16px; }
  .modal { width:min(100%,680px); max-height:calc(100vh - 32px); overflow:auto; background:#fff;
           border-radius:12px; box-shadow:0 20px 50px rgba(15,23,42,.22); }
  .head { display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid var(--line); }
  .head h5 { margin:0; font-size:15px; font-weight:700; }
  .head .x { border:0; background:transparent; font-size:18px; line-height:1; color:var(--muted); cursor:pointer; }
  .body { padding:18px; }
  .row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .full { grid-column:1 / -1; }
  label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  label .req { color:#ef4444; }
  input[type=text], select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line);
    border-radius:7px; font:inherit; font-size:13px; background:#fff; color:var(--ink); outline:none; }
  input[type=text]:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
  .ltr { direction:ltr; text-align:right; }
  textarea { resize:vertical; min-height:58px; }
  .hint { font-size:11px; color:var(--muted); margin-top:5px; }
  .switch { display:flex; align-items:center; gap:8px; font-size:13px; }
  .switch input { width:34px; height:18px; accent-color:var(--primary); }
  .foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px; border-top:1px solid var(--line); }
  .foot button { padding:8px 16px; border-radius:8px; font:inherit; font-size:13px; cursor:pointer; border:1px solid var(--line); background:#fff; }
  .foot .save { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:700; }
  @media (max-width:560px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="entry" id="entry"></div>
<div class="backdrop">
  <div class="modal" role="dialog" aria-label="مشتری جدید">
    <div class="head"><h5 id="title">مشتری جدید</h5><button class="x" type="button" aria-label="بستن">×</button></div>
    <div class="body">
      <div class="row">
        <div class="full"><label>نام <span class="req">*</span></label><input type="text"></div>
        <div><label>موبایل</label><input type="text" class="ltr" inputmode="tel"></div>
        <div><label>تلفن ثابت</label><input type="text" class="ltr" inputmode="tel"></div>
        <div class="full"><label>آدرس</label><input type="text"></div>
        <div><label>شناسه ملی خریدار</label><input type="text" class="ltr" inputmode="numeric" maxlength="14"></div>
        <div><label>کد پستی خریدار</label><input type="text" class="ltr" inputmode="numeric"></div>
        <div class="full">
          <label>معرف</label>
          <select><option>— بدون معرف —</option><option>معرف نمونه</option></select>
          <div class="hint">در فاکتور فروش این مشتری، معرف بهصورت خودکار انتخاب میشود</div>
        </div>
        <div class="full"><label>یادداشت</label><textarea rows="2"></textarea></div>
        <div class="full"><label class="switch"><input type="checkbox" checked> فعال باشد</label></div>
      </div>
    </div>
    <div class="foot"><button type="button">انصراف (Esc)</button><button type="button" class="save">ذخیره</button></div>
  </div>
</div>
<script>
const entries = ['طرف حسابها', 'فاکتور فروش', 'ثبت سفارش ویزیتوری', 'حوالهٔ تحویل', 'پذیرش تعمیرات'];
const box = document.getElementById('entry');
const title = document.getElementById('title');
entries.forEach((name, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = name;
  if (i === 0) b.classList.add('active');
  b.addEventListener('click', () => {
    [...box.children].forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    title.textContent = 'مشتری جدید';
  });
  box.appendChild(b);
});
</script>
</body>
</html>
