# ─────────────────────────────────────────────────────────────────────────────
#  ساخت بستهٔ پابلیش OnPrem (win-x64) از همین مخزن
#
#  چرا این‌جا؟ ساخت Inventory.Api روی ماشین‌های کم‌حافظه با OOM شکست می‌خورد و
#  پوشهٔ بستهٔ محلی مودیان (packages/) در گیت نیست. این workflow هر دو را حل می‌کند:
#  بستهٔ TaxCollectData.Library را از مخزن عمومی Moadianrepo می‌گیرد و روی رانر
#  windows-latest (۷ گیگ رم) بیلد می‌کند.
#
#  ⚠️ هیچ رمز دیتابیس یا کلید خصوصی‌ای این‌جا نیست و نباید اضافه شود؛ مخزن عمومی است.
#     فایل‌های نصب مخصوص مشتری (run-server.bat / appsettings.Production.json) را
#     پس از دانلود artifact، از پوشهٔ تحویل کنار فایل‌ها بگذارید.
# ─────────────────────────────────────────────────────────────────────────────
name: publish-forougharia

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-forougharia.yml'

permissions:
  contents: read

jobs:
  build-onprem:
    name: publish win-x64 (OnPrem)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: TotallCollectionSoftware
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: نصب .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: آوردن بستهٔ محلی مودیان (از مخزن عمومی Moadianrepo)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force inventory/packages | Out-Null
          $url = "https://raw.githubusercontent.com/mohammadforoughifar/Moadianrepo/main/TaxCollectData.Library.0.0.27.nupkg"
          Invoke-WebRequest -Uri $url -OutFile inventory/packages/TaxCollectData.Library.0.0.27.nupkg
          Get-ChildItem inventory/packages

      - name: بازیابی بسته‌ها
        run: |
          dotnet restore inventory/src/Inventory.Api/Inventory.Api.csproj
          dotnet restore inventory/src/Inventory.Client/Inventory.Client.csproj
          dotnet restore inventory/tools/LicenseTool/LicenseTool.csproj

      - name: انتشار کلاینت Blazor
        run: dotnet publish inventory/src/Inventory.Client/Inventory.Client.csproj -c Release --no-restore -o "${{ runner.temp }}/client-publish"

      - name: انتقال رابط کاربری به wwwroot سرور
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force inventory/src/Inventory.Api/wwwroot | Out-Null
          Copy-Item -Recurse -Force "${{ runner.temp }}/client-publish/wwwroot/*" inventory/src/Inventory.Api/wwwroot/

      - name: انتشار API برای win-x64 (OnPrem)
        run: >
          dotnet publish inventory/src/Inventory.Api/Inventory.Api.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishProfile=OnPrem --no-restore
          -o "${{ runner.temp }}/inventory-server"

      - name: تأیید جاسازی کلید امضا (شرط تحویل)
        shell: pwsh
        run: |
          dotnet build inventory/tools/LicenseTool/LicenseTool.csproj -c Release
          $tool = "inventory/tools/LicenseTool/bin/Release/net8.0/LicenseTool.dll"
          dotnet $tool keys --dir "${{ runner.temp }}/inventory-server" --expect sup-202612
          if ($LASTEXITCODE -ne 0) {
            Write-Error "بیلد کلید sup-202612 را ندارد."
            exit 1
          }

      - name: اطلاعات بسته
        shell: pwsh
        run: |
          $info = [ordered]@{
            builtAt  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            builtBy  = "GitHub Actions / publish-forougharia"
            runUrl   = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            commit   = "${{ github.sha }}"
            deployment = "OnPrem"
            runtime  = "win-x64 (framework-dependent, نیازمند .NET 8 Hosting Bundle)"
            signingKeyId = "sup-202612"
            signingKeyFingerprintSha256 = "5fdd666dfd6c5f64bd5d17766a52f8a27d34ff019e8934ebcd4421e9e0914f4e"
            urls     = "http://192.168.30.108:8181"
          }
          $info | ConvertTo-Json | Set-Content -Encoding UTF8 "${{ runner.temp }}/inventory-server/package-info.json"

      - name: آپلود بسته
        uses: actions/upload-artifact@v4
        with:
          name: inventory-server-onprem
          path: |
            ${{ runner.temp }}/inventory-server
          if-no-files-found: error
          retention-days: 14
