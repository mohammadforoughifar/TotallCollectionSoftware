    <script>
        // تعیین آدرس سرور API در زمان اجرا
        // ================== ادیتور متن غنی ==================
        // اجرای دستور روی ادیتورِ متمرکز/اول (برای سازگاری با کدهای قبلی)
        window.rteExec = function (cmd, value) {
            document.execCommand(cmd, false, value === undefined ? null : value);
        };
        // یافتن ریشه ادیتور
        window.rteGetHtml = function (id) { var el = document.getElementById(id); return el ? el.innerHTML : ""; };
        window.rteSetHtml = function (id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html || ""; };
        window.rteGetEl = function (el) { return el ? el.innerHTML : ""; };
        window.rteSetEl = function (el, html) { if (el) el.innerHTML = html || ""; };
        window.rteExecEl = function (el, cmd, value) {
            if (!el) return;
            el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand(cmd, false, value === undefined ? null : value);
        };

        // نگهداری انتخاب متن به‌ازای هر ادیتور؛ انتخاب یک فرم نباید روی ادیتور فرم دیگر اعمال شود.
        window.__rteSavedRanges = window.__rteSavedRanges || {};
        window.rteSaveSelection = function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var sel = window.getSelection();
            if (sel.rangeCount > 0 && el.contains(sel.anchorNode))
                window.__rteSavedRanges[id] = sel.getRangeAt(0).cloneRange();
        };
        window.rteRestoreSelection = function (id) {
            var el = document.getElementById(id);
            var range = window.__rteSavedRanges[id];
            if (!el || !range) return;
            el.focus();
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        };

        // اجرای دستور روی ادیتور مشخص — فوکوس و dispatch
        window.rteExecId = function (id, cmd, value) {
            var el = document.getElementById(id);
            if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand(cmd, false, value === undefined ? null : value);
        };
        // تنظیم قلم
        window.rteFont = function (id, family) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("fontName", false, family);
        };
        // تنظیم اندازه قلم (به پیکسل) — با ترفند font[size=7]
        window.rteSize = function (id, px) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            // برای ساخت تگ فونت خام، styleWithCSS را موقتاً خاموش می‌کنیم
            document.execCommand("styleWithCSS", false, false);
            document.execCommand("fontSize", false, "7");
            document.execCommand("styleWithCSS", false, true);
            var fac = (el.querySelectorAll('font[size="7"]'));
            for (var i = 0; i < fac.length; i++) {
                var s = document.createElement("span");
                s.style.fontSize = px;
                s.innerHTML = fac[i].innerHTML;
                fac[i].replaceWith(s);
            }
        };
        // رنگ متن
        window.rteColor = function (id, color) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("foreColor", false, color);
        };
        // رنگ پس‌زمینه (هایلایت)
        window.rteHilite = function (id, color) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("hiliteColor", false, color);
        };
        // درج لینک — پروتکل‌های اجرایی مثل javascript: پذیرفته نمی‌شوند.
        window.rteLink = function (id) {
            var url = (window.prompt("آدرس لینک را وارد کنید:", "https://") || "").trim();
            if (!url) return;
            if (!/^(https?:\/\/|mailto:|tel:|\/)/i.test(url)) url = "https://" + url;
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("createLink", false, url);
        };

        // فاصله خطوط و جهت نوشتار روی پاراگراف جاری (مشابه Paragraph در Word)
        window.rteCurrentBlock = function (id) {
            var el = document.getElementById(id); if (!el) return null;
            window.rteRestoreSelection(id);
            var sel = window.getSelection(), node = sel && sel.anchorNode;
            if (node && node.nodeType === 3) node = node.parentElement;
            while (node && node !== el && !/^(P|DIV|H1|H2|H3|H4|BLOCKQUOTE|LI|TD|TH)$/.test(node.tagName || ""))
                node = node.parentElement;
            return !node || node === el ? el : node;
        };
        window.rteLineHeight = function (id, value) {
            var block = window.rteCurrentBlock(id); if (!block) return;
            block.style.lineHeight = /^([1-3](\.[0-9]+)?)$/.test(value || "") ? value : "2";
            block.focus && block.focus();
        };
        window.rteDirection = function (id, value) {
            var block = window.rteCurrentBlock(id); if (!block) return;
            var dir = value === "ltr" ? "ltr" : "rtl";
            block.setAttribute("dir", dir);
            block.style.textAlign = dir === "rtl" ? "right" : "left";
        };

        // درج جدول با تعداد سطر/ستون محدود تا HTML بسیار بزرگ ناخواسته ساخته نشود.
        window.rteInsertTable = function (id) {
            var faToEn = function (v) { return (v || "").replace(/[۰-۹]/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹".indexOf(d); }); };
            var rows = parseInt(faToEn(window.prompt("تعداد سطر جدول (۱ تا ۲۰):", "3")), 10);
            if (!rows) return;
            var cols = parseInt(faToEn(window.prompt("تعداد ستون جدول (۱ تا ۱۰):", "3")), 10);
            if (!cols) return;
            rows = Math.max(1, Math.min(20, rows)); cols = Math.max(1, Math.min(10, cols));
            var html = "<table><tbody>";
            for (var r = 0; r < rows; r++) {
                html += "<tr>";
                for (var c = 0; c < cols; c++) html += "<td><br></td>";
                html += "</tr>";
            }
            html += "</tbody></table><p><br></p>";
            window.rteExecId(id, "insertHTML", html);
        };

        // چاپ فقط متن ادیتور در iframe sandbox؛ محتوای پیست‌شده اجازه اجرای script ندارد.
        window.rtePrint = function (id) {
            var el = document.getElementById(id); if (!el) return;
            var frame = document.createElement("iframe");
            frame.setAttribute("sandbox", "allow-modals allow-same-origin");
            frame.style.cssText = "position:fixed;width:1px;height:1px;left:-9999px;border:0";
            frame.srcdoc = "<!doctype html><html lang='fa' dir='rtl'><head><meta charset='utf-8'><style>body{font-family:Tahoma,Arial,sans-serif;line-height:2;padding:18mm;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #777;padding:6px}img{max-width:100%}</style></head><body>" + el.innerHTML + "</body></html>";
            frame.onload = function () {
                try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { window.print(); }
                setTimeout(function () { frame.remove(); }, 1000);
            };
            document.body.appendChild(frame);
        };

        // چاپ نامه (اتوماسیون اداری)
        window.ltxPrint = function () { window.print(); };
        // باز کردن PDF نامه (چاپ روی سربرگ) در تب جدید — ورودی base64
        window.ltxOpenPdf = function (base64, fileName) {
            try {
                var bin = atob(base64);
                var arr = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                var blob = new Blob([arr], { type: 'application/pdf' });
                var url = URL.createObjectURL(blob);
                var w = window.open(url, '_blank');
                if (!w) { // popup blocked → download
                    var a = document.createElement('a');
                    a.href = url; a.download = fileName || 'letter.pdf';
                    document.body.appendChild(a); a.click(); a.remove();
                }
                setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
            } catch (e) { console.error(e); }
        };

        window.inventoryApiBase = function (fallback) {
            try {
                var stored = localStorage.getItem('apiBaseUrl');
                if (stored) return stored;
            } catch (e) { }
            try {
                var h = window.location.host;
                // محیط پیش‌نمایش ابری: تبدیل پورت جاری به پورت API (5100)
                if (h.indexOf('.e2b.app') !== -1) {
                    return window.location.protocol + '//' + h.replace(/^[0-9]+-/, '5100-');
                }
                // روی localhost:
                //  - اگر صفحه روی همان پورت API (5100) است → حالت تک‌سروره، از همان مبدا استفاده کن
                //  - در غیر این صورت (مثلاً کلاینت روی 5210 جدا اجرا شده) → به پورت پیش‌فرض API (5100) برو
                if (h.indexOf('localhost') === 0 || h.indexOf('127.0.0.1') === 0) {
                    var port = window.location.port;
                    if (port === '5100' || port === '') return window.location.origin;
                    return fallback || 'http://localhost:5100';
                }
            } catch (e) { }
            return fallback || 'http://localhost:5100';
        };

        // تشخیص صفحه کوچک‌تر از ~۱۲ اینچ (حالت موبایل/اندروید)
        window.appShell = {
            isMobile: function () {
                return window.matchMedia('(max-width: 1279.98px)').matches;
            },
            watch: function (ref) {
                var mq = window.matchMedia('(max-width: 1279.98px)');
                var handler = function () {
                    try { ref.invokeMethodAsync('OnScreenChanged', mq.matches); } catch (e) { }
                };
                if (mq.addEventListener) mq.addEventListener('change', handler);
                else mq.addListener(handler);
            }
        };
    </script>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-card">
                <svg width="64" height="64" viewBox="0 0 512 512" fill="none">
                    <rect width="512" height="512" rx="112" fill="#4f46e5" />
                    <g stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M256 118 L416 200 V392 L256 474 L96 392 V200 Z" />
                        <path d="M256 474 V296" />
                        <path d="M416 200 L256 296 L96 200" />
                    </g>
                </svg>
                <div class="mt-3 fw-semibold">در حال بارگذاری سامانه…</div>
                <div class="spinner-border text-primary mt-2" style="width:1.6rem;height:1.6rem" role="status"></div>
            </div>

    </div>

    <div id="blazor-error-ui">
        خطایی رخ داده است.
        <a href="" class="reload">بارگذاری مجدد</a>
        <a class="dismiss">بستن</a>

    <script>
        // ---------- کلیدهای میانبر سراسری ----------
        // F1 = ذخیره / ثبت | F2 = افزودن سطر | Esc = خروج / بستن
        document.addEventListener('keydown', function (e) {
            var key = null;
            if (e.key === 'F1') key = 'f1';
            else if (e.key === 'F2') key = 'f2';
            else if (e.key === 'Escape') key = 'esc';
            if (!key) return;
            var els = document.querySelectorAll('[data-hotkey="' + key + '"]');
            if (els.length) {
                e.preventDefault();
                // آخرین المنت = بالاترین مودال باز
                els[els.length - 1].click();
            }
        }, true);
    </script>
    <script src="lib/chart.umd.min.js"></script>
    <script src="lib/qrcode.min.js"></script>
    <script>
        // ---------- QR فاکتور الکترونیکی (سامانه مودیان) ----------
        window.appQr = {
            render: function (id, text) {
                var el = document.getElementById(id);
                if (!el) return;
                el.innerHTML = '';
                new QRCode(el, { text: text || '', width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
            },
            clear: function (id) { var el = document.getElementById(id); if (el) el.innerHTML = ''; }
        };
    </script>
    <script>
        // ---------- نمودارهای داشبورد (Chart.js) ----------
        window.appCharts = {
            _charts: {},
            destroy: function (id) {
                if (this._charts[id]) { this._charts[id].destroy(); delete this._charts[id]; }
            },
            bar: function (id, labels, salesData, profitData) {
                var el = document.getElementById(id);
                if (!el || !window.Chart) return;
                this.destroy(id);
                this._charts[id] = new Chart(el, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'فروش', data: salesData, backgroundColor: 'rgba(79,70,229,.75)', borderRadius: 8, barPercentage: .55 },
                            { label: 'سود', data: profitData, backgroundColor: 'rgba(5,150,105,.75)', borderRadius: 8, barPercentage: .55 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { font: { family: 'Vazirmatn, Tahoma' }, usePointStyle: true, pointStyle: 'circle' } },
                            tooltip: { rtl: true, bodyFont: { family: 'Vazirmatn, Tahoma' }, titleFont: { family: 'Vazirmatn, Tahoma' },
                                callbacks: { label: function (c) { return c.dataset.label + ': ' + c.parsed.y.toLocaleString('fa-IR') + ' ریال'; } } }
                        },
                        scales: {
                            y: { ticks: { font: { family: 'Vazirmatn, Tahoma' }, callback: function (v) { return (v / 1000000).toLocaleString('fa-IR') + 'م'; } }, grid: { color: 'rgba(148,163,184,.15)' } },
                            x: { ticks: { font: { family: 'Vazirmatn, Tahoma' } }, grid: { display: false } }
                        }
                    }
                });
            },
            line: function (id, labels, data, label, color) {
                var el = document.getElementById(id);
                if (!el || !window.Chart) return;
                this.destroy(id);
                var ctx = el.getContext('2d');
                var grad = ctx.createLinearGradient(0, 0, 0, el.height || 220);
                grad.addColorStop(0, color + '55'); grad.addColorStop(1, color + '05');
                this._charts[id] = new Chart(el, {
                    type: 'line',
                    data: { labels: labels, datasets: [{ label: label, data: data, borderColor: color, backgroundColor: grad, fill: true, tension: .4, pointRadius: 3, pointBackgroundColor: color, borderWidth: 2.5 }] },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { rtl: true, bodyFont: { family: 'Vazirmatn, Tahoma' },
                                callbacks: { label: function (c) { return c.parsed.y.toLocaleString('fa-IR') + ' ریال'; } } }
                        },
                        scales: {
                            y: { ticks: { font: { family: 'Vazirmatn, Tahoma' }, callback: function (v) { return (v / 1000000).toLocaleString('fa-IR') + 'م'; } }, grid: { color: 'rgba(148,163,184,.15)' } },
                            x: { ticks: { font: { family: 'Vazirmatn, Tahoma' } }, grid: { display: false } }
                        }
                    }
                });
            },
            doughnut: function (id, labels, data, colors) {
                var el = document.getElementById(id);
                if (!el || !window.Chart) return;
                this.destroy(id);
                this._charts[id] = new Chart(el, {
                    type: 'doughnut',
                    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff', hoverOffset: 8 }] },
                    options: {
                        responsive: true, maintainAspectRatio: false, cutout: '68%',
                        plugins: {
                            legend: { position: 'bottom', labels: { font: { family: 'Vazirmatn, Tahoma' }, usePointStyle: true, pointStyle: 'circle', padding: 14 } },
                            tooltip: { rtl: true, bodyFont: { family: 'Vazirmatn, Tahoma' },
                                callbacks: { label: function (c) { return c.label + ': ' + c.parsed.toLocaleString('fa-IR') + ' ریال'; } } }
                        }
                    }
                });
            }
        };

        // ---------- QR کارت ویزیت معرف (با retry تا آماده شدن DOM/کتابخانه) ----------
        window.makeQr = function (elementId, text, size) {
            var attempts = 0;
            function tryMake() {
                attempts++;
                var el = document.getElementById(elementId);
                if (!el || !window.QRCode) {
                    if (attempts < 20) setTimeout(tryMake, 150);
                    return;
                }
                try {
                    el.innerHTML = '';
                    new QRCode(el, {
                        text: text,
                        width: size || 110,
                        height: size || 110,
                        colorDark: '#0f172a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    console.error('makeQr error:', e);
                    if (attempts < 20) setTimeout(tryMake, 150);
                }
            }
            tryMake();
        };

        // ---------- چاپ کارت ویزیت ----------
        window.printBusinessCard = function () {
            document.body.classList.add('print-card-mode');
            window.print();
            setTimeout(function () { document.body.classList.remove('print-card-mode'); }, 500);
        };

        // ---------- دانلود فایل (خروجی CSV/Excel) ----------
        window.saveAsFile = function (fileName, base64Content) {
            try {
                var bytes = atob(base64Content);
                var arr = new Uint8Array(bytes.length);
                for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
                var blob = new Blob([arr], { type: 'text/csv;charset=utf-8;' });
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
            } catch (e) {
                console.error('saveAsFile error:', e);
            }
        };
    </script>

    <script src="js/file-preview.js?v=3"></script>
    <script>
        (function () {
            async function fpFetch(url, token, mimeHint) {
                var h = {};
                if (token) h['Authorization'] = 'Bearer ' + token;
                var r = await fetch(url, { headers: h });
                if (!r.ok) {
                    var t = '';
                    try { t = await r.text(); } catch (e) { }
                    var msg = t || ('خطای ' + r.status);
                    try { var j = JSON.parse(t); if (j && j.message) msg = j.message; } catch (e) { }
                    throw new Error(msg);
                }
                var buf = await r.arrayBuffer();
                var mime = ((r.headers.get('content-type') || mimeHint || 'application/octet-stream').split(';')[0] || '').trim();
                return URL.createObjectURL(new Blob([buf], { type: mime || 'application/octet-stream' }));
            }
            async function fpText(url, token) {
                var h = {};
                if (token) h['Authorization'] = 'Bearer ' + token;
                var r = await fetch(url, { headers: h });
                if (!r.ok) throw new Error('خطای ' + r.status);
                return await r.text();
            }
            window.filePreview = window.filePreview || {};
            window.filePreview.fetchBlobUrl = fpFetch;
            window.filePreview.fetchText = fpText;
            window.filePreview.htmlToBlobUrl = window.filePreview.htmlToBlobUrl || function (html) {
                return URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
            };
            window.filePreview.revoke = window.filePreview.revoke || function (u) { try { if (u) URL.revokeObjectURL(u); } catch (e) { } };
            window.fpFetchBlobUrl = window.filePreview.fetchBlobUrl;
            window.fpFetchText = window.filePreview.fetchText;
            window.fpHtmlToBlobUrl = window.filePreview.htmlToBlobUrl;
            window.fpRevoke = window.filePreview.revoke;
        })();
    </script>
