    <script>
        // تعیین آدرس سرور API در زمان اجرا
        // ================== ادیتور متن غنی ==================
        // اجرای دستور روی ادیتورِ متمرکز/اول (برای سازگاری با کدهای قبلی)
        // ============ کپی متن (با فالبک برای http بدون گواهی) ============
        window.invCopyText = function (text) {
            try {
                if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text); return true; }
                var ta = document.createElement('textarea');
                ta.value = text; ta.setAttribute('readonly', '');
                ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
                var ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) { return false; }
        };

        window.rteExec = function (cmd, value) {
            document.execCommand(cmd, false, value === undefined ? null : value);
        };
        // یافتن ریشه ادیتور
        window.rteGetHtml = function (id) { var el = document.getElementById(id); return el ? el.innerHTML : ""; };
        window.rteSetHtml = function (id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html || ""; };
        window.rteGetEl = function (el) { return el ? el.innerHTML : ""; };
        window.rteSetEl = function (el, html) { if (el) el.innerHTML = html || ""; };
        window.rteExecEl = function (el, cmd, value) {
            if (!el) return;
            el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand(cmd, false, value === undefined ? null : value);
        };

        // نگهداری آخرین انتخاب متن (برای اعمال فونت/رنگ/اندازه وقتی فوکوس به نوار ابزار می‌رود)
        window.__rteSavedRange = null;
        window.rteSaveSelection = function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var sel = window.getSelection();
            if (sel.rangeCount > 0 && el.contains(sel.anchorNode))
                window.__rteSavedRange = sel.getRangeAt(0).cloneRange();
        };
        window.rteRestoreSelection = function (id) {
            var el = document.getElementById(id);
            if (!el || !window.__rteSavedRange) return;
            el.focus();
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(window.__rteSavedRange);
        };

        // اجرای دستور روی ادیتور مشخص — فوکوس و dispatch
        window.rteExecId = function (id, cmd, value) {
            var el = document.getElementById(id);
            if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand(cmd, false, value === undefined ? null : value);
        };
        // تنظیم قلم
        window.rteFont = function (id, family) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("fontName", false, family);
        };
        // تنظیم اندازه قلم (به پیکسل) — با ترفند font[size=7]
        window.rteSize = function (id, px) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            // برای ساخت تگ فونت خام، styleWithCSS را موقتاً خاموش می‌کنیم
            document.execCommand("styleWithCSS", false, false);
            document.execCommand("fontSize", false, "7");
            document.execCommand("styleWithCSS", false, true);
            var fac = (el.querySelectorAll('font[size="7"]'));
            for (var i = 0; i < fac.length; i++) {
                var s = document.createElement("span");
                s.style.fontSize = px;
                s.innerHTML = fac[i].innerHTML;
                fac[i].replaceWith(s);
            }
        };
        // رنگ متن
        window.rteColor = function (id, color) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("foreColor", false, color);
        };
        // رنگ پس‌زمینه (هایلایت)
        window.rteHilite = function (id, color) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("hiliteColor", false, color);
        };
        // درج لینک
        window.rteLink = function (id) {
            var url = window.prompt("آدرس لینک را وارد کنید:", "https://");
            if (!url) return;
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("createLink", false, url);
        };
        // درج جدول
        window.rteTable = function (id, rows, cols) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            rows = parseInt(rows) || 2; cols = parseInt(cols) || 2;
            var html = '<table class="table table-bordered my-2" style="width:100%; border-collapse:collapse; border:1px solid #cbd5e1;"><tbody>';
            for (var r = 0; r < rows; r++) {
                html += '<tr>';
                for (var c = 0; c < cols; c++) {
                    html += '<td style="border:1px solid #cbd5e1; padding:8px;">&nbsp;</td>';
                }
                html += '</tr>';
            }
            html += '</tbody></table><p><br></p>';
            document.execCommand("insertHTML", false, html);
        };
        // درج محتوای HTML سفارشی
        window.rteInsertHtml = function (id, html) {
            var el = document.getElementById(id); if (!el) return;
            window.rteRestoreSelection(id); el.focus();
            document.execCommand("insertHTML", false, html);
        };
        // تغییر جهت متن (RTL / LTR)
        window.rteToggleDir = function (id) {
            var el = document.getElementById(id); if (!el) return;
            var current = el.getAttribute("dir") || "rtl";
            var next = current === "rtl" ? "ltr" : "rtl";
            el.setAttribute("dir", next);
            el.style.textAlign = next === "rtl" ? "right" : "left";
        };
        // چاپ نامه (اتوماسیون اداری)
        window.ltxPrint = function () { window.print(); };
        window.printWorkOrderDetail = function () { window.print(); };
        // ---------- چاپ سند در یک iframe جداگانه ----------
        // سند چاپ باید مستقل از استایل‌های صفحه و پوستهٔ اپ باشد؛ وگرنه قواعد
        // @media print اپ (مخفی‌کردن سایدبار/محتوا و …) محتوای سند را هم می‌پوشاند
        // و خروجی سفید می‌شود. اینجا یک سند کامل و خودبسنده در iframe می‌سازیم و
        // پنجرهٔ چاپِ همان iframe را باز می‌کنیم.
        // __FONT_BASE__ در سند با آدرس واقعی پوشهٔ فونت‌ها جایگزین می‌شود.
        window.giPrint = function (html) {
            try {
                var base = document.baseURI.replace(/[^/]*$/, '');
                html = (html || '').split('__FONT_BASE__').join(base);

                var f = document.getElementById('gi-print-frame');
                if (!f) {
                    f = document.createElement('iframe');
                    f.id = 'gi-print-frame';
                    f.setAttribute('aria-hidden', 'true');
                    // صفر-بعد اما نه display:none — مرورگرهای Some از iframe پنهان چاپ نمی‌کنند
                    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;';
                    document.body.appendChild(f);
                }
                var w = f.contentWindow;
                w.document.open();
                w.document.write(html);
                w.document.close();
                w.focus();
                // کمی صبر تا مرورگر چیدمان و فونت‌ها را آماده کند
                setTimeout(function () { try { w.print(); } catch (e) { } }, 80);
                return true;
            } catch (e) {
                console.error('giPrint:', e);
                return false;
            }
        };
        // فوکوس روی یک المان با شناسه — ناوبری جدول سطرهای حواله با کلید Enter
        // (select=true متن موجود را انتخاب می‌کند تا تایپ قدرت، قالب را جعل کند)
        window.focusById = function (id, select) {
            var el = document.getElementById(id);
            if (!el || el.disabled) return false;
            el.focus();
            if (select && el.select) { try { el.select(); } catch (e) { } }
            return true;
        };
        // باز کردن PDF نامه (چاپ روی سربرگ) در تب جدید — ورودی base64
        window.ltxOpenPdf = function (base64, fileName) {
            try {
                var bin = atob(base64);
                var arr = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                var blob = new Blob([arr], { type: 'application/pdf' });
                var url = URL.createObjectURL(blob);
                var w = window.open(url, '_blank');
                if (!w) { // popup blocked → download
                    var a = document.createElement('a');
                    a.href = url; a.download = fileName || 'letter.pdf';
                    document.body.appendChild(a); a.click(); a.remove();
                }
                setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
            } catch (e) { console.error(e); }
        };

        window.inventoryApiBase = function (fallback) {
            try {
                var stored = localStorage.getItem('apiBaseUrl');
                if (stored) return stored;
            } catch (e) { }
            try {
                var h = window.location.host;
                // محیط پیش‌نمایش ابری: تبدیل پورت جاری به پورت API (5100)
                if (h.indexOf('.e2b.app') !== -1) {
                    return window.location.protocol + '//' + h.replace(/^[0-9]+-/, '5100-');
                }
                // استقرار تک‌سرورهٔ منتشرشده: اگر صفحه روی همان پورت API (5100) سرو می‌شود —
                // چه از localhost و چه از IP/دامنهٔ سرور (مثلاً http://192.168.1.50:5100) —
                // از همان مبدا استفاده کن. (قبلاً فقط localhost پوشش داده می‌شد و در انتشار،
                // مرورگرِ کاربرِ راه‌دور به localhost خودش هدایت می‌شد و هیچ داده‌ای نمی‌آمد.)
                var port = window.location.port;
                if (port === '5100') return window.location.origin;
                // روی localhost با پورت دیگر (مثلاً کلاینت توسعه روی 5210) → به پورت پیش‌فرض API (5100) برو
                if (h.indexOf('localhost') === 0 || h.indexOf('127.0.0.1') === 0) {
                    if (port === '') return window.location.origin;
                    return fallback || 'http://localhost:5100';
                }
            } catch (e) { }
            return fallback || 'http://localhost:5100';
        };

        // تشخیص صفحه کوچک‌تر از ~۱۲ اینچ (حالت موبایل/اندروید)
        window.appShell = {
            isMobile: function () {
                return window.matchMedia('(max-width: 1279.98px)').matches;
            },
            watch: function (ref) {
                var mq = window.matchMedia('(max-width: 1279.98px)');
                var handler = function () {
                    try { ref.invokeMethodAsync('OnScreenChanged', mq.matches); } catch (e) { }
                };
                if (mq.addEventListener) mq.addEventListener('change', handler);
                else mq.addListener(handler);
            }
        };
    </script>

    <script>
        // ---------- توابع کمکی فوکوس و اسکرول سند انبار ----------
        window.focusLastProductInput = function () {
            setTimeout(function () {
                var inputs = document.querySelectorAll('.doc-grid tbody tr:last-child .ss input');
                if (inputs && inputs.length) {
                    inputs[0].focus();
                    if (inputs[0].select) inputs[0].select();
                }
            }, 60);
        };

        // ---------- کلیدهای میانبر سراسری و ناوبری بین فیلدها با اینتر ----------
        // F2 = ثبت نهایی | F1 = افزودن ردیف (سند انبار) یا ثبت فرم | Esc = خروج | Enter = جابه‌جایی بین فیلدها
        document.addEventListener('keydown', function (e) {
            // کلید F1 برای افزودن ردیف در فرم ثبت سند انبار
            if (e.key === 'F1') {
                var addLineBtn = document.getElementById('btn-add-line') || document.getElementById('btn-add-line-empty');
                if (addLineBtn && !addLineBtn.disabled && addLineBtn.offsetParent !== null) {
                    e.preventDefault();
                    addLineBtn.click();
                    return;
                }
            }

            var key = null;
            if (e.key === 'F2') key = 'f2';
            else if (e.key === 'F1') key = 'f1';
            else if (e.key === 'Escape') key = 'esc';
            if (key) {
                var els = Array.from(document.querySelectorAll('[data-hotkey="' + key + '"]'));
                var visibleEls = els.filter(function (el) {
                    return !el.disabled && el.offsetParent !== null;
                });
                if (visibleEls.length) {
                    e.preventDefault();
                    visibleEls[visibleEls.length - 1].click();
                    return;
                }
            }

            // جلوگیری از پرش‌های ناخواسته مرورگر هنگام استفاده از جهت‌نما و اینتر در کمبوباکس باز
            var ssEl = e.target && e.target.closest ? e.target.closest('.ss') : null;
            var isSsMenuOpen = ssEl && ssEl.querySelector('.ss-menu');
            if (isSsMenuOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
                // فقط preventDefault تا مکان‌نما در اینپوت حرکت نکند و فرم سابمیت نشود، اما رویداد به Blazor برسد
                e.preventDefault();
                if (e.key === 'Enter') return;
            }

            // ناوبری با کلید Enter بین المان‌ها
            if (e.key === 'Enter') {
                var target = e.target;
                if (!target) return;
                var tag = (target.tagName || '').toUpperCase();
                if (tag === 'TEXTAREA') return;
                if (tag === 'BUTTON' || (tag === 'INPUT' && (target.type === 'submit' || target.type === 'button'))) return;

                // اگر منوی کمبوباکس باز است، اینتر باید صرفاً انتخاب را تایید کند
                if (isSsMenuOpen) return;

                var container = target.closest('.doc-grid') || target.closest('.modal-content') || target.closest('form') || target.closest('.card-body') || document.body;
                var focusables = Array.from(container.querySelectorAll('input:not([disabled]):not([type="hidden"]), select:not([disabled])'));
                focusables = focusables.filter(function (el) { return el.offsetParent !== null && !el.readOnly; });

                var idx = focusables.indexOf(target);
                if (idx > -1 && idx < focusables.length - 1) {
                    e.preventDefault();
                    var next = focusables[idx + 1];
                    next.focus();
                    if (next.select && typeof next.select === 'function') {
                        next.select();
                    }
                }
            }
        }, true);
    </script>
    <script src="lib/chart.umd.min.js"></script>
    <script>
        // ---------- QR فاکتور الکترونیکی (سامانه مودیان) ----------
        window.appQr = {
            render: function (id, text) {
                var el = document.getElementById(id);
                if (!el) return;
                el.innerHTML = '';
                new QRCode(el, { text: text || '', width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
            },
            clear: function (id) { var el = document.getElementById(id); if (el) el.innerHTML = ''; }
        };
    </script>
    <script>
        // ---------- نمودارهای داشبورد (Chart.js) ----------
        window.appCharts = {
            _charts: {},
            destroy: function (id) {
                if (this._charts[id]) { this._charts[id].destroy(); delete this._charts[id]; }
            },
            bar: function (id, labels, salesData, profitData) {
                var el = document.getElementById(id);
                if (!el || !window.Chart) return;
                this.destroy(id);
                this._charts[id] = new Chart(el, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'فروش', data: salesData, backgroundColor: 'rgba(79,70,229,.75)', borderRadius: 8, barPercentage: .55 },
                            { label: 'سود', data: profitData, backgroundColor: 'rgba(5,150,105,.75)', borderRadius: 8, barPercentage: .55 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { font: { family: 'Vazirmatn, Tahoma' }, usePointStyle: true, pointStyle: 'circle' } },
                            tooltip: { rtl: true, bodyFont: { family: 'Vazirmatn, Tahoma' }, titleFont: { family: 'Vazirmatn, Tahoma' },
                                callbacks: { label: function (c) { return c.dataset.label + ': ' + c.parsed.y.toLocaleString('fa-IR') + ' ریال'; } } }
                        },
                        scales: {
                            y: { ticks: { font: { family: 'Vazirmatn, Tahoma' }, callback: function (v) { return (v / 1000000).toLocaleString('fa-IR') + 'م'; } }, grid: { color: 'rgba(148,163,184,.15)' } },
                            x: { ticks: { font: { family: 'Vazirmatn, Tahoma' } }, grid: { display: false } }
                        }
                    }
                });
            },
            line: function (id, labels, data, label, color) {
                var el = document.getElementById(id);
                if (!el || !window.Chart) return;
                this.destroy(id);
                var ctx = el.getContext('2d');
                var grad = ctx.createLinearGradient(0, 0, 0, el.height || 220);
                grad.addColorStop(0, color + '55'); grad.addColorStop(1, color + '05');
                this._charts[id] = new Chart(el, {
                    type: 'line',
                    data: { labels: labels, datasets: [{ label: label, data: data, borderColor: color, backgroundColor: grad, fill: true, tension: .4, pointRadius: 3, pointBackgroundColor: color, borderWidth: 2.5 }] },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { rtl: true, bodyFont: { family: 'Vazirmatn, Tahoma' },
                                callbacks: { label: function (c) { return c.parsed.y.toLocaleString('fa-IR') + ' ریال'; } } }
                        },
                        scales: {
                            y: { ticks: { font: { family: 'Vazirmatn, Tahoma' }, callback: function (v) { return (v / 1000000).toLocaleString('fa-IR') + 'م'; } }, grid: { color: 'rgba(148,163,184,.15)' } },
                            x: { ticks: { font: { family: 'Vazirmatn, Tahoma' } }, grid: { display: false } }
                        }
                    }
                });
            },
            doughnut: function (id, labels, data, colors) {
                var el = document.getElementById(id);
                if (!el || !window.Chart) return;
                this.destroy(id);
                this._charts[id] = new Chart(el, {
                    type: 'doughnut',
                    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff', hoverOffset: 8 }] },
                    options: {
                        responsive: true, maintainAspectRatio: false, cutout: '68%',
                        plugins: {
                            legend: { position: 'bottom', labels: { font: { family: 'Vazirmatn, Tahoma' }, usePointStyle: true, pointStyle: 'circle', padding: 14 } },
                            tooltip: { rtl: true, bodyFont: { family: 'Vazirmatn, Tahoma' },
                                callbacks: { label: function (c) { return c.label + ': ' + c.parsed.toLocaleString('fa-IR') + ' ریال'; } } }
                        }
                    }
                });
            }
        };

        // ---------- QR کارت ویزیت معرف (با retry تا آماده شدن DOM/کتابخانه) ----------
        window.makeQr = function (elementId, text, size) {
            var attempts = 0;
            function tryMake() {
                attempts++;
                var el = document.getElementById(elementId);
                if (!el || !window.QRCode) {
                    if (attempts < 20) setTimeout(tryMake, 150);
                    return;
                }
                try {
                    el.innerHTML = '';
                    new QRCode(el, {
                        text: text,
                        width: size || 110,
                        height: size || 110,
                        colorDark: '#0f172a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    console.error('makeQr error:', e);
                    if (attempts < 20) setTimeout(tryMake, 150);
                }
            }
            tryMake();
        };

        // ---------- چاپ کارت ویزیت ----------
        window.printBusinessCard = function () {
            document.body.classList.add('print-card-mode');
            window.print();
            setTimeout(function () { document.body.classList.remove('print-card-mode'); }, 500);
        };

        // ---------- دانلود فایل (خروجی CSV/Excel) ----------
        window.saveAsFile = function (fileName, base64Content) {
            try {
                var bytes = atob(base64Content);
                var arr = new Uint8Array(bytes.length);
                for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
                var blob = new Blob([arr], { type: 'text/csv;charset=utf-8;' });
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
            } catch (e) {
                console.error('saveAsFile error:', e);
            }
        };
        window.printHtml = function (html) {
            try {
                var w = window.open('', '_blank');
                if (!w) return;
                w.document.write(html);
                w.document.close();
                w.focus();
                setTimeout(function () { w.print(); }, 300);
            } catch (e) {
                console.error('printHtml error:', e);
            }
        };
    </script>

    <script>
        (function () {
            async function fpFetch(url, token, mimeHint) {
                var h = {};
                if (token) h['Authorization'] = 'Bearer ' + token;
                var r = await fetch(url, { headers: h });
                if (!r.ok) {
                    var t = '';
                    try { t = await r.text(); } catch (e) { }
                    var msg = t || ('خطای ' + r.status);
                    try { var j = JSON.parse(t); if (j && j.message) msg = j.message; } catch (e) { }
                    throw new Error(msg);
                }
                var buf = await r.arrayBuffer();
                var mime = ((r.headers.get('content-type') || mimeHint || 'application/octet-stream').split(';')[0] || '').trim();
                return URL.createObjectURL(new Blob([buf], { type: mime || 'application/octet-stream' }));
            }
            async function fpText(url, token) {
                var h = {};
                if (token) h['Authorization'] = 'Bearer ' + token;
                var r = await fetch(url, { headers: h });
                if (!r.ok) throw new Error('خطای ' + r.status);
                return await r.text();
            }
            window.filePreview = window.filePreview || {};
            window.filePreview.fetchBlobUrl = fpFetch;
            window.filePreview.fetchText = fpText;
            window.filePreview.htmlToBlobUrl = window.filePreview.htmlToBlobUrl || function (html) {
                return URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
            };
            window.filePreview.revoke = window.filePreview.revoke || function (u) { try { if (u) URL.revokeObjectURL(u); } catch (e) { } };
            window.fpFetchBlobUrl = window.filePreview.fetchBlobUrl;
            window.fpFetchText = window.filePreview.fetchText;
            window.fpHtmlToBlobUrl = window.filePreview.htmlToBlobUrl;
            window.fpRevoke = window.filePreview.revoke;
        })();
    </script>

    <script>
        // ثبت سرویس‌ورکر + به‌روزرسانی خودکار بعد از هر پابلیش:
        // وقتی نسخهٔ جدید فعال شد (controllerchange)، صفحه یک‌بار رفرش می‌شود تا
        // کاربر بلافاصله نسخهٔ جدید را ببیند (قبلاً تا بستن همهٔ تب‌ها روی نسخهٔ قدیمی می‌ماند).
        (function () {
            if (!('serviceWorker' in navigator)) return;
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(function (reg) {
                if (reg && reg.update) { try { reg.update(); } catch (e) { } }
            }).catch(function () { /* Push diagnostics reports registration failures. */ });
            var refreshed = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                // فقط وقتی از قبل کنترلر داشتیم (یعنی «تعویض نسخه» است، نه اولین نصب)
                if (refreshed) return;
                refreshed = true;
                if (window.__swHadController) window.location.reload();
            });
            window.__swHadController = !!navigator.serviceWorker.controller;
        })();
    </script>
